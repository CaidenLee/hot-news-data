name: 🔥 定时抓取热点

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch hot news with AI summary
        env:
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
        run: node scripts/fetch-hot-news.js

      - name: Push to Feishu
        if: always()
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: node scripts/push-feishu.js

      - name: Commit and push
        run: |
          git config user.name "hot-news-bot"
          git config user.email "bot@hot-news.app"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 auto-update"
          git push
